version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: omninovel-dev-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password_secure}
      POSTGRES_DB: ${DB_NAME:-omninovel_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-omninovel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Redis 7 (Cache, Session & BullMQ Queue)
  redis:
    image: redis:7-alpine
    container_name: omninovel-dev-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. MinIO S3-Compatible Object Storage (Strictly Private)
  minio:
    image: minio/minio:latest
    container_name: omninovel-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 4. MinIO Bucket Initializer (Tạo bucket và xóa bỏ triệt để mọi anonymous policy)
  minio-init-buckets:
    image: minio/mc:latest
    container_name: omninovel-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET_MANGA:-manga-media};
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET_NOVEL:-novel-media};
      /usr/bin/mc anonymous set none local/${MINIO_BUCKET_MANGA:-manga-media};
      /usr/bin/mc anonymous set none local/${MINIO_BUCKET_NOVEL:-novel-media};
      echo 'MinIO private buckets initialized and anonymous access set to NONE.';
      exit 0;
      "

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
