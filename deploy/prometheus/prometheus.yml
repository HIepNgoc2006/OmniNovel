global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. OmniNovel Core NestJS API (internal Docker network: omninovel-internal)
  - job_name: 'omninovel-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8000']
        labels:
          app: 'omninovel-api'
          env: 'production'

  # 2. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
